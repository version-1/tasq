openapi: 3.1.0
info:
  title: Tasq Issue Tracker API
  version: 0.1.0
  description: |
    Local issue tracking API used by the web UI, TUI, and orchestrator.

    JSON success responses use `{ "data": ..., "meta": {} }`.
    JSON error responses use `{ "error": { "code": "...", "message": "..." }, "meta": {} }`.
    `204 No Content` and CORS `OPTIONS` responses do not include a JSON body.
servers:
  - url: http://localhost:37651
    description: Local issue-tracker API
tags:
  - name: Health
  - name: Projects
  - name: Issues
  - name: Comments
  - name: Attachments
  - name: Summary
paths:
  /api/v1/health:
    get:
      tags:
        - Health
      summary: Check API health.
      responses:
        "200":
          description: The API is healthy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /api/v1/summary:
    get:
      tags:
        - Summary
      summary: Get the issue board summary.
      responses:
        "200":
          description: Issue board summary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SummaryResponse"
        "500":
          $ref: "#/components/responses/Error"
  /api/v1/projects:
    get:
      tags:
        - Projects
      summary: List projects.
      responses:
        "200":
          description: Project list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectListResponse"
        "500":
          $ref: "#/components/responses/Error"
    post:
      tags:
        - Projects
      summary: Create a project.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectInput"
      responses:
        "201":
          description: Created project.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectResponse"
        "400":
          $ref: "#/components/responses/Error"
  /api/v1/projects/{id}:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
    get:
      tags:
        - Projects
      summary: Get a project.
      responses:
        "200":
          description: Project.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectResponse"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    patch:
      tags:
        - Projects
      summary: Update a project.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProjectInput"
      responses:
        "200":
          description: Updated project.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectResponse"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      tags:
        - Projects
      summary: Delete a project.
      responses:
        "204":
          description: Project deleted.
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/projects/{id}/check:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
    post:
      tags:
        - Projects
      summary: Check whether a project workflow documents tq command usage.
      requestBody:
        required: true
        content:
          text/plain:
            schema:
              type: string
              description: Raw WORKFLOW.md content.
      responses:
        "200":
          description: Workflow check result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectCheckResponse"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/projects/{id}/workflow:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
    get:
      tags:
        - Projects
      summary: Get the stored project workflow.
      responses:
        "200":
          description: Project workflow.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectWorkflowResponse"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    put:
      tags:
        - Projects
      summary: Upsert a project's stored workflow.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertProjectWorkflowInput"
      responses:
        "200":
          description: Project workflow upserted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectWorkflowResponse"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      tags:
        - Projects
      summary: Delete a project workflow override.
      description: Deletes the workflow stored in the database. If no workflow override exists for the project, the endpoint still returns 204 so callers can fall back to file-based workflow resolution.
      responses:
        "204":
          description: Project workflow override deleted or not present.
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/issues:
    get:
      tags:
        - Issues
      summary: List issues.
      parameters:
        - name: states
          in: query
          required: false
          description: Comma-separated issue statuses. Omit this parameter or pass an empty value to list all issues.
          schema:
            type: string
            example: ready,in_progress
        - name: project_id
          in: query
          required: false
          description: Project ID used to limit issues to a single project. Omit this parameter to list issues from all projects.
          schema:
            type: integer
            format: int64
        - name: project_ids
          in: query
          required: false
          description: Comma-separated project IDs used to limit issues to selected projects.
          schema:
            type: string
            example: 1,2
        - name: priorities
          in: query
          required: false
          description: Comma-separated issue priorities. Omit this parameter or pass an empty value to list all priorities.
          schema:
            type: string
            example: urgent,high
        - name: assignee
          in: query
          required: false
          description: Assignee name used to limit issues to a single assignee. Omit this parameter to list all assignees.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Maximum number of issues to return. Omit this parameter to preserve the legacy unpaginated response.
          schema:
            type: integer
            minimum: 1
            maximum: 50
        - name: offset
          in: query
          required: false
          description: Zero-based issue offset used for pagination.
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: sort_by
          in: query
          required: false
          description: Issue field used for sorting. Defaults to updated_at.
          schema:
            type: string
            enum:
              - id
              - priority
              - created_at
              - updated_at
            default: updated_at
        - name: sort_direction
          in: query
          required: false
          description: Sort direction. Defaults to descending order.
          schema:
            type: string
            enum:
              - asc
              - desc
            default: desc
      responses:
        "200":
          description: Issue list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssueListResponse"
        "400":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
    post:
      tags:
        - Issues
      summary: Create an issue.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateIssueInput"
      responses:
        "201":
          description: Created issue.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssueResponse"
        "400":
          $ref: "#/components/responses/Error"
  /api/v1/issues/states:
    post:
      tags:
        - Issues
      summary: Get issue states by issue IDs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IssueStatesInput"
      responses:
        "200":
          description: Issue states. Missing issue IDs are omitted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssueStateListResponse"
        "400":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
  /api/v1/queue:
    get:
      tags:
        - Issues
      summary: List dispatchable and pending ready issues.
      description: Returns ready issues split into queued and pending derived states. Queued issues have no active dependencies and are sorted by priority descending, then ID ascending. Pending issues still have at least one active dependency.
      parameters:
        - name: project_id
          in: query
          required: false
          description: Project ID used to limit queued and pending issues to a single project. Omit this parameter to list queue state across all projects.
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Queue state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueueResponse"
        "400":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
  /api/v1/issues/{id}:
    parameters:
      - $ref: "#/components/parameters/IssueID"
    get:
      tags:
        - Issues
      summary: Get an issue.
      responses:
        "200":
          description: Issue.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssueResponse"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    patch:
      tags:
        - Issues
      summary: Update an issue.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateIssueInput"
      responses:
        "200":
          description: Updated issue.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssueResponse"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/issues/{issueId}/comments:
    parameters:
      - $ref: "#/components/parameters/IssueIDPath"
    get:
      tags:
        - Comments
      summary: List issue comments.
      parameters:
        - name: cursor
          in: query
          required: false
          description: Comment ID cursor. Results start after this ID.
          schema:
            type: integer
            format: int64
            minimum: 0
            default: 0
        - name: limit
          in: query
          required: false
          description: Maximum number of comments to return.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: Comment list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommentListResponse"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    post:
      tags:
        - Comments
      summary: Create an issue comment.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCommentInput"
      responses:
        "201":
          description: Created comment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommentResponse"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/comments/{id}:
    parameters:
      - $ref: "#/components/parameters/CommentID"
    patch:
      tags:
        - Comments
      summary: Update a comment body.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCommentInput"
      responses:
        "200":
          description: Updated comment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommentResponse"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/attachments:
    get:
      tags:
        - Attachments
      summary: List attachments for an issue or comment.
      parameters:
        - name: entity_type
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/AttachmentEntityType"
        - name: entity_id
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Attachment list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttachmentListResponse"
        "400":
          $ref: "#/components/responses/Error"
    post:
      tags:
        - Attachments
      summary: Upload an image attachment.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - entity_type
                - entity_id
                - file
              properties:
                entity_type:
                  $ref: "#/components/schemas/AttachmentEntityType"
                entity_id:
                  type: string
                file:
                  type: string
                  format: binary
                  description: PNG, JPEG, GIF, or WebP image up to 5 MiB.
      responses:
        "201":
          description: Created attachment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttachmentResponse"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/attachments/{id}/content:
    parameters:
      - $ref: "#/components/parameters/AttachmentID"
    get:
      tags:
        - Attachments
      summary: Download attachment content.
      responses:
        "200":
          description: Attachment bytes.
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/gif:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/attachments/{id}:
    parameters:
      - $ref: "#/components/parameters/AttachmentID"
    delete:
      tags:
        - Attachments
      summary: Delete attachment metadata and bytes.
      responses:
        "204":
          description: Attachment deleted.
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
components:
  parameters:
    ProjectID:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    IssueID:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    IssueIDPath:
      name: issueId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    CommentID:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    AttachmentID:
      name: id
      in: path
      required: true
      schema:
        type: string
  responses:
    Error:
      description: Error response.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    ApiMeta:
      type: object
      additionalProperties: true
      description: Response metadata. Currently empty, reserved for future extensions.
    IssueListMeta:
      type: object
      description: Issue list pagination metadata.
      required:
        - limit
        - offset
        - total
        - nextOffset
      properties:
        limit:
          type: integer
          description: Applied page size. `0` means the request omitted pagination and returned the legacy unpaginated response.
          minimum: 0
          maximum: 50
        offset:
          type: integer
          minimum: 0
        total:
          type: integer
          minimum: 0
        nextOffset:
          type:
            - integer
            - "null"
          minimum: 0
    ErrorInfo:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: Stable error code using the <controller>.<action>.<error_type> format.
          example: projects.get.not_found
        message:
          type: string
          example: project not found
    ErrorResponse:
      type: object
      required:
        - error
        - meta
      properties:
        error:
          $ref: "#/components/schemas/ErrorInfo"
        meta:
          $ref: "#/components/schemas/ApiMeta"
    HealthData:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          example: ok
    HealthResponse:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          $ref: "#/components/schemas/HealthData"
        meta:
          $ref: "#/components/schemas/ApiMeta"
    IssueStatus:
      type: string
      enum:
        - backlog
        - ready
        - in_progress
        - review
        - done
        - blocked
        - failed
        - cancelled
        - duplicate
    Priority:
      type: string
      enum:
        - low
        - normal
        - high
        - urgent
    CommentType:
      type: string
      enum:
        - progress
        - blocker
        - handoff
        - general
    AttachmentEntityType:
      type: string
      enum:
        - issue
        - comment
    Project:
      type: object
      required:
        - id
        - key
        - name
        - description
        - location
        - workflowChecksum
        - createdAt
        - updatedAt
      properties:
        id:
          type: integer
          format: int64
        key:
          type: string
          pattern: "^([A-Z][A-Z0-9_]{0,19}|[a-z][a-z0-9-]{0,63})$"
        name:
          type: string
        description:
          type: string
        location:
          type: string
        workflowChecksum:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreateProjectInput:
      type: object
      required:
        - key
        - name
        - location
      properties:
        key:
          type: string
          pattern: "^([A-Z][A-Z0-9_]{0,19}|[a-z][a-z0-9-]{0,63})$"
        name:
          type: string
        description:
          type: string
          default: ""
        location:
          type: string
    UpdateProjectInput:
      type: object
      properties:
        key:
          type: string
          pattern: "^([A-Z][A-Z0-9_]{0,19}|[a-z][a-z0-9-]{0,63})$"
        name:
          type: string
        description:
          type: string
        location:
          type: string
    ProjectCheckResult:
      type: object
      required:
        - passed
        - reason
      properties:
        passed:
          type: boolean
        reason:
          type: string
    ProjectWorkflow:
      type: object
      required:
        - projectId
        - frontmatter
        - body
        - checksum
        - createdAt
        - updatedAt
      properties:
        projectId:
          type: integer
          format: int64
        frontmatter:
          type: object
          additionalProperties: true
        body:
          type: string
        checksum:
          type: string
          pattern: "^[0-9a-fA-F]{64}$"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    UpsertProjectWorkflowInput:
      type: object
      required:
        - frontmatter
        - body
        - checksum
      properties:
        frontmatter:
          type: object
          additionalProperties: true
        body:
          type: string
        checksum:
          type: string
          pattern: "^[0-9a-fA-F]{64}$"
    Issue:
      type: object
      required:
        - id
        - projectId
        - projectKey
        - title
        - description
        - status
        - priority
        - assignee
        - dependency_ids
        - createdAt
        - updatedAt
      properties:
        id:
          type: integer
          format: int64
        projectId:
          type: integer
          format: int64
        projectKey:
          type: string
        title:
          type: string
        description:
          type: string
        status:
          $ref: "#/components/schemas/IssueStatus"
        priority:
          $ref: "#/components/schemas/Priority"
        assignee:
          type: string
          default: ""
        dependency_ids:
          type: array
          items:
            type: integer
            format: int64
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    IssueState:
      type: object
      required:
        - id
        - status
      properties:
        id:
          type: integer
          format: int64
        status:
          $ref: "#/components/schemas/IssueStatus"
    Comment:
      type: object
      required:
        - id
        - issueId
        - author
        - type
        - body
        - createdAt
      properties:
        id:
          type: integer
          format: int64
        issueId:
          type: integer
          format: int64
        author:
          type: string
        type:
          $ref: "#/components/schemas/CommentType"
        body:
          type: string
        createdAt:
          type: string
          format: date-time
    Attachment:
      type: object
      required:
        - id
        - entityType
        - entityId
        - filename
        - contentType
        - size
        - createdAt
      properties:
        id:
          type: string
        entityType:
          $ref: "#/components/schemas/AttachmentEntityType"
        entityId:
          type: string
        filename:
          type: string
        contentType:
          type: string
          enum:
            - image/png
            - image/jpeg
            - image/gif
            - image/webp
        size:
          type: integer
          format: int64
          maximum: 5242880
        createdAt:
          type: string
          format: date-time
    CreateCommentInput:
      type: object
      required:
        - author
        - body
      properties:
        author:
          type: string
          minLength: 1
        type:
          $ref: "#/components/schemas/CommentType"
          default: general
        body:
          type: string
          minLength: 1
          maxLength: 10000
    UpdateCommentInput:
      type: object
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 10000
    CreateIssueInput:
      type: object
      required:
        - projectId
        - title
      properties:
        projectId:
          type: integer
          format: int64
        title:
          type: string
        description:
          type: string
          default: ""
        status:
          $ref: "#/components/schemas/IssueStatus"
        priority:
          $ref: "#/components/schemas/Priority"
        assignee:
          type: string
        dependency_ids:
          type: array
          description: Initial dependency issue IDs. Omit or pass an empty array to create the issue without dependencies.
          items:
            type: integer
            format: int64
    QueueIssue:
      allOf:
        - $ref: "#/components/schemas/Issue"
        - type: object
          properties:
            blocked_dependency_ids:
              type: array
              description: Active dependency issue IDs that keep a pending issue out of the queued set.
              items:
                type: integer
                format: int64
    Queue:
      type: object
      required:
        - queued
        - pending
      properties:
        queued:
          type: array
          items:
            $ref: "#/components/schemas/QueueIssue"
        pending:
          type: array
          items:
            $ref: "#/components/schemas/QueueIssue"
    UpdateIssueInput:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        status:
          $ref: "#/components/schemas/IssueStatus"
        priority:
          $ref: "#/components/schemas/Priority"
        assignee:
          type: string
        dependency_ids:
          type: array
          description: Replaces the full dependency set when present. Omit this field to preserve existing dependencies; pass an empty array to clear dependencies.
          items:
            type: integer
            format: int64
    IssueStatesInput:
      type: object
      required:
        - ids
      properties:
        ids:
          type: array
          items:
            type: integer
            format: int64
    IssueStats:
      type: object
      required:
        - commentCount
      properties:
        commentCount:
          type: integer
          minimum: 0
    IssueSummary:
      allOf:
        - $ref: "#/components/schemas/Issue"
        - type: object
          required:
            - stats
          properties:
            stats:
              $ref: "#/components/schemas/IssueStats"
    Column:
      type: object
      required:
        - status
        - title
        - issues
      properties:
        status:
          $ref: "#/components/schemas/IssueStatus"
        title:
