<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/logo/BlackLogo-2.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="tasq-version" content="__TASQ_VERSION__" />
    <meta name="tasq-commit" content="__TASQ_COMMIT__" />
    <script>
      const systemTheme = window.matchMedia("(prefers-color-scheme: dark)").matches
        ? "dark"
        : "light";
      let theme = systemTheme;

      try {
        const storedTheme = window.localStorage.getItem("tasq.theme");
        if (storedTheme === "dark" || storedTheme === "light") {
          theme = storedTheme;
        }
      } catch {
        // Fall back to the operating system preference when storage is unavailable.
      }

      document.documentElement.dataset.theme = theme;
    </script>
    <title>tasq</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
