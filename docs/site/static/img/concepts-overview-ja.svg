<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" role="img" aria-labelledby="title desc">
  <title id="title">Tasq の概念マップ</title>
  <desc id="desc">client、issue tracker、orchestrator、storage、workspace boundary を示す図。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#2f4b7c"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1f2937" flood-opacity="0.16"/>
    </filter>
    <style>
      .bg { fill: #f8fafc; }
      .panel { fill: #ffffff; stroke: #d8dee9; stroke-width: 2; rx: 18; filter: url(#shadow); }
      .client { fill: #e0f2fe; stroke: #0284c7; }
      .tracker { fill: #ecfdf5; stroke: #059669; }
      .orchestrator { fill: #fff7ed; stroke: #ea580c; }
      .store { fill: #f3f4f6; stroke: #6b7280; }
      .workspace { fill: #fef3c7; stroke: #d97706; }
      .title { font: 700 28px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .label { font: 700 18px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .small { font: 500 14px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #374151; }
      .tiny { font: 500 12px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #4b5563; }
      .line { stroke: #2f4b7c; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .muted { stroke: #94a3b8; stroke-width: 2.5; stroke-dasharray: 7 7; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="1120" height="620"/>
  <text class="title" x="48" y="58">Tasq のエージェント workflow model</text>
  <text class="small" x="48" y="86">Task state、run state、isolated workspace を分離し、AI agent の並列作業を扱います。</text>

  <rect class="panel" x="40" y="125" width="250" height="260"/>
  <text class="label" x="68" y="162">Client</text>
  <rect class="client" x="70" y="195" width="170" height="56" rx="12"/>
  <text class="label" x="115" y="229">tq CLI</text>
  <rect class="client" x="70" y="275" width="170" height="56" rx="12"/>
  <text class="label" x="108" y="309">Web UI</text>

  <rect class="panel" x="380" y="120" width="300" height="178"/>
  <text class="label" x="410" y="158">Issue Tracker</text>
  <text class="small" x="410" y="190">Project、issue、comment、</text>
  <text class="small" x="410" y="212">attachment、board summary</text>
  <rect class="tracker" x="410" y="235" width="230" height="42" rx="10"/>
  <text class="small" x="450" y="261">User workflow API</text>

  <rect class="panel" x="380" y="365" width="300" height="178"/>
  <text class="label" x="410" y="403">Orchestrator</text>
  <text class="small" x="410" y="435">Run、runner event、isolated</text>
  <text class="small" x="410" y="457">workspace metadata、inspection</text>
  <rect class="orchestrator" x="410" y="480" width="230" height="42" rx="10"/>
  <text class="small" x="448" y="506">Runtime state API</text>

  <rect class="panel" x="770" y="115" width="300" height="400"/>
  <text class="label" x="800" y="153">Local storage</text>
  <rect class="store" x="800" y="185" width="220" height="56" rx="12"/>
  <text class="small" x="846" y="209">issues.sqlite</text>
  <text class="tiny" x="836" y="228">issue-tracker data</text>
  <rect class="store" x="800" y="265" width="220" height="56" rx="12"/>
  <text class="small" x="825" y="289">attachments/</text>
  <text class="tiny" x="842" y="308">image bytes</text>
  <rect class="store" x="800" y="345" width="220" height="56" rx="12"/>
  <text class="small" x="818" y="369">orchestrator.sqlite</text>
  <text class="tiny" x="850" y="388">run history</text>
  <rect class="workspace" x="800" y="425" width="220" height="56" rx="12"/>
  <text class="small" x="835" y="449">workspaces/</text>
  <text class="tiny" x="822" y="468">isolated task dirs</text>

  <path class="line" d="M240 223 C300 223, 312 209, 378 209"/>
  <path class="line" d="M240 303 C300 303, 312 236, 378 236"/>
  <path class="muted" d="M240 303 C320 330, 310 438, 378 438"/>
  <path class="line" d="M680 210 C720 210, 735 213, 798 213"/>
  <path class="line" d="M680 245 C720 250, 735 293, 798 293"/>
  <path class="line" d="M680 455 C720 455, 735 373, 798 373"/>
  <path class="line" d="M680 492 C720 492, 735 453, 798 453"/>

  <rect x="48" y="530" width="1024" height="54" rx="14" fill="#eef2ff" stroke="#818cf8"/>
  <text class="small" x="72" y="553">Boundary rule:</text>
  <text class="tiny" x="72" y="573">Issue status change は issue-tracker を通ります。Run lifecycle と workspace detail は orchestrator に留まります。</text>
</svg>
