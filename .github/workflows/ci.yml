name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Symphony SPEC matches upstream
        run: |
          curl --fail --location --silent --show-error \
            https://raw.githubusercontent.com/openai/symphony/main/SPEC.md \
            --output /tmp/openai-symphony-SPEC.md
          cmp /tmp/openai-symphony-SPEC.md docs/symphony/SPEC.md

  go:
    name: Go services
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download Go modules
        run: go mod download

      - name: Test Go packages
        run: go test $(go list ./... | grep -Ev '^github.com/version-1/tasq/(cmd/tq|internal/cli/tq)$')

      - name: Build issue-tracker
        run: go build ./cmd/issue-tracker

      - name: Build orchestrator
        run: go build ./cmd/orchestrator

      - name: Build TUI
        run: go build ./cmd/tasq-tui

  tq:
    name: TQ command
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download Go modules
        run: go mod download

      - name: Test TQ command
        run: go test ./internal/cli/tq

      - name: Build TQ command
        run: go build ./cmd/tq

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  compose:
    name: Compose config
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate default Compose config
        run: docker compose config

      - name: Validate fixed-port Compose config
        run: ISSUE_TRACKER_PORT=18080 WEB_PORT=13000 docker compose config
