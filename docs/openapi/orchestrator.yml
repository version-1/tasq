openapi: 3.1.0
info:
  title: Tasq Orchestrator HTTP API
  version: 0.1.0
  description: |
    Optional loopback HTTP API exposed by the orchestrator for runtime inspection
    and manual refresh requests.

    The server binds to `127.0.0.1` when enabled with `--port` or `server.port`
    in `WORKFLOW.md`. Responses are returned as direct JSON payloads and do not
    use the issue-tracker `{ "data": ..., "meta": {} }` envelope.
servers:
  - url: http://127.0.0.1:37652
    description: Local orchestrator HTTP API
tags:
  - name: Runtime State
  - name: Runtime Debug
  - name: Refresh
paths:
  /api/v1/state:
    get:
      tags:
        - Runtime State
      summary: Get orchestrator runtime state.
      description: |
        Returns active run summaries from the orchestrator runstore.

        `retrying` is currently returned as an empty array, and `codex_totals`
        and `rate_limits` are currently returned as null because those values are
        not persisted by the orchestrator yet.
      responses:
        "200":
          description: Current orchestrator runtime state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StateResponse"
        "500":
          $ref: "#/components/responses/Error"
  /api/v1/refresh:
    post:
      tags:
        - Refresh
      summary: Request an immediate poll and reconciliation cycle.
      description: |
        Queues a coalesced refresh request when a worker refresher is available.
        In builds without the worker coordinator this endpoint returns 503.
      responses:
        "202":
          description: Refresh request accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefreshResponse"
        "503":
          $ref: "#/components/responses/Error"
  /api/v1/{issue_identifier}:
    parameters:
      - $ref: "#/components/parameters/IssueIdentifier"
    get:
      tags:
        - Runtime Debug
      summary: Get runtime details for an issue.
      description: |
        Returns the latest run detail for an issue identifier in `issue-<id>`
        format.
      responses:
        "200":
          description: Runtime details for the issue.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssueRuntimeResponse"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
  /api/v1/{issue_identifier}/runs/{run_id}/conversations:
    parameters:
      - $ref: "#/components/parameters/IssueIdentifier"
      - $ref: "#/components/parameters/RunID"
    get:
      tags:
        - Runtime Debug
      summary: Get conversation events for one run.
      description: |
        Returns chronological run status transition events and `turn_completed`
        events for a run that belongs to the requested issue identifier.
      responses:
        "200":
          description: Conversation events for the run.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationResponse"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
components:
  parameters:
    IssueIdentifier:
      name: issue_identifier
      in: path
      required: true
      description: Issue identifier using the orchestrator workspace key format.
      schema:
        type: string
        pattern: "^issue-[1-9][0-9]*$"
        example: issue-42
    RunID:
      name: run_id
      in: path
      required: true
      description: Orchestrator run identifier.
      schema:
        type: string
        minLength: 1
        example: run_123abc
  responses:
    Error:
      description: Error response.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    ErrorInfo:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          example: issue_not_found
        message:
          type: string
          example: issue not found
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          $ref: "#/components/schemas/ErrorInfo"
    RunState:
      type: string
      enum:
        - queued
        - starting
        - running
        - waiting_for_input
        - succeeded
        - failed
        - cancelled
    TokenSummary:
      type: object
      required:
        - input_tokens
        - output_tokens
        - total_tokens
      properties:
        input_tokens:
          type: integer
          minimum: 0
        output_tokens:
          type: integer
          minimum: 0
        total_tokens:
          type: integer
          minimum: 0
    RunSummary:
      type: object
      required:
        - issue_id
        - issue_identifier
        - state
        - session_id
        - turn_count
        - last_event
        - last_message
        - started_at
        - last_event_at
        - tokens
      properties:
        issue_id:
          type: string
          example: "42"
        issue_identifier:
          type: string
          example: issue-42
        state:
          $ref: "#/components/schemas/RunState"
        session_id:
          type: string
          example: thread_abc123
        turn_count:
          type: integer
          minimum: 0
        last_event:
          type: string
          example: turn_started
        last_message:
          type: string
          example: turn_id=turn-1
        started_at:
          type: string
          format: date-time
        last_event_at:
          type:
            - string
            - "null"
          format: date-time
        tokens:
          $ref: "#/components/schemas/TokenSummary"
    StateCounts:
      type: object
      required:
        - running
        - retrying
      properties:
        running:
          type: integer
          minimum: 0
        retrying:
          type: integer
          minimum: 0
    StateResponse:
      type: object
      required:
        - generated_at
        - counts
        - running
        - retrying
        - codex_totals
        - rate_limits
      properties:
        generated_at:
          type: string
          format: date-time
        counts:
          $ref: "#/components/schemas/StateCounts"
        running:
          type: array
          items:
            $ref: "#/components/schemas/RunSummary"
        retrying:
          type: array
          items:
            $ref: "#/components/schemas/RetrySummary"
        codex_totals:
          type:
            - object
            - "null"
          additionalProperties: true
        rate_limits:
          type:
            - object
            - "null"
          additionalProperties: true
    RetrySummary:
      type: object
      additionalProperties: false
      description: Reserved for future retry queue details. Currently always empty.
    WorkspaceRuntime:
      type: object
      required:
        - path
      properties:
        path:
          type: string
          example: /tmp/symphony_workspaces/issue-42
    AttemptSummary:
      type: object
      required:
        - restart_count
        - current_retry_attempt
      properties:
        restart_count:
          type: integer
          minimum: 0
        current_retry_attempt:
          type: integer
          minimum: 0
    IssueRunSummary:
      type: object
      required:
        - run_id
        - status
        - attempt
        - created_at
        - updated_at
      properties:
        run_id:
          type: string
          example: run_123abc
        status:
          $ref: "#/components/schemas/RunState"
        attempt:
          type: integer
          minimum: 0
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    LogsSummary:
      type: object
      required:
        - codex_session_logs
      properties:
        codex_session_logs:
          type: array
          items: {}
    RuntimeEvent:
      type: object
      required:
        - at
        - event
        - message
      properties:
        at:
          type: string
          format: date-time
        event:
          type: string
          example: turn_started
        message:
          type: string
          example: turn_id=turn-1
    IssueRuntimeResponse:
      type: object
      required:
        - issue_identifier
        - issue_id
        - status
        - workspace
        - attempts
        - runs
        - running
        - retry
        - logs
        - recent_events
        - last_error
        - tracked
      properties:
        issue_identifier:
          type: string
          example: issue-42
        issue_id:
          type: string
          example: "42"
        status:
          $ref: "#/components/schemas/RunState"
        workspace:
          $ref: "#/components/schemas/WorkspaceRuntime"
        attempts:
          $ref: "#/components/schemas/AttemptSummary"
        runs:
          type: array
          items:
            $ref: "#/components/schemas/IssueRunSummary"
        running:
          oneOf:
            - $ref: "#/components/schemas/RunSummary"
            - type: "null"
        retry:
          type:
            - object
            - "null"
          additionalProperties: true
        logs:
          $ref: "#/components/schemas/LogsSummary"
        recent_events:
          type: array
          items:
            $ref: "#/components/schemas/RuntimeEvent"
        last_error:
          type:
            - string
            - "null"
        tracked:
          type: object
          additionalProperties: true
    ConversationEvent:
      type: object
      required:
        - at
        - event
        - message
        - payload_json
      properties:
        at:
          type: string
          format: date-time
        event:
          type: string
          enum:
            - turn_completed
            - running
            - succeeded
            - failed
            - cancelled
        message:
          type: string
          example: turn_id=turn-1
        payload_json:
          type: string
          description: Raw JSON payload from the runner event. `turn_completed` payloads may contain aggregatedOutput.
    ConversationResponse:
      type: object
      required:
        - issue_identifier
        - issue_id
        - run_id
        - events
      properties:
        issue_identifier:
          type: string
          example: issue-42
        issue_id:
          type: string
          example: "42"
        run_id:
          type: string
          example: run_123abc
        events:
          type: array
          items:
            $ref: "#/components/schemas/ConversationEvent"
    RefreshResponse:
      type: object
      required:
        - queued
        - coalesced
        - requested_at
        - operations
      properties:
        queued:
          type: boolean
          example: true
        coalesced:
          type: boolean
          example: false
        requested_at:
          type: string
          format: date-time
        operations:
          type: array
          items:
            type: string
            enum:
              - poll
              - reconcile
          example:
            - poll
            - reconcile
