openapi: 3.1.0
info:
  title: Tasq Issue Tracker API
  version: 0.1.0
  description: |
    Local issue tracking API used by the web UI, TUI, and orchestrator.

    JSON success responses use `{ "data": ..., "meta": {} }`.
    JSON error responses use `{ "error": { "code": "...", "message": "..." }, "meta": {} }`.
    `204 No Content` and CORS `OPTIONS` responses do not include a JSON body.
servers:
  - url: http://localhost:8080
    description: Local issue-tracker API
tags:
  - name: Health
  - name: Projects
  - name: Workspaces
  - name: Issues
  - name: Summary
  - name: Work Items
  - name: Orchestrator Events
paths:
  /api/v1/health:
    get:
      tags:
        - Health
      summary: Check API health.
      responses:
        "200":
          description: The API is healthy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /api/v1/summary:
    get:
      tags:
        - Summary
      summary: Get the issue board summary.
      responses:
        "200":
          description: Issue board summary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SummaryResponse"
        "500":
          $ref: "#/components/responses/Error"
  /api/v1/projects:
    get:
      tags:
        - Projects
      summary: List projects.
      responses:
        "200":
          description: Project list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectListResponse"
        "500":
          $ref: "#/components/responses/Error"
    post:
      tags:
        - Projects
      summary: Create a project.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectInput"
      responses:
        "201":
          description: Created project.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectResponse"
        "400":
          $ref: "#/components/responses/Error"
  /api/v1/projects/{id}:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
    get:
      tags:
        - Projects
      summary: Get a project.
      responses:
        "200":
          description: Project.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectResponse"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    patch:
      tags:
        - Projects
      summary: Update a project.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProjectInput"
      responses:
        "200":
          description: Updated project.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectResponse"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      tags:
        - Projects
      summary: Delete a project and its workspaces.
      responses:
        "204":
          description: Project deleted.
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/workspaces:
    get:
      tags:
        - Workspaces
      summary: List workspaces.
      responses:
        "200":
          description: Workspace list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceListResponse"
        "500":
          $ref: "#/components/responses/Error"
    post:
      tags:
        - Workspaces
      summary: Create a workspace.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWorkspaceInput"
      responses:
        "201":
          description: Created workspace.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceResponse"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/workspaces/{id}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceID"
    get:
      tags:
        - Workspaces
      summary: Get a workspace.
      responses:
        "200":
          description: Workspace.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceResponse"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    patch:
      tags:
        - Workspaces
      summary: Update a workspace.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateWorkspaceInput"
      responses:
        "200":
          description: Updated workspace.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceResponse"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      tags:
        - Workspaces
      summary: Delete a workspace.
      responses:
        "204":
          description: Workspace deleted.
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/issues:
    get:
      tags:
        - Issues
      summary: List issues.
      responses:
        "200":
          description: Issue list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssueListResponse"
        "500":
          $ref: "#/components/responses/Error"
    post:
      tags:
        - Issues
      summary: Create an issue.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateIssueInput"
      responses:
        "201":
          description: Created issue.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssueResponse"
        "400":
          $ref: "#/components/responses/Error"
  /api/v1/issues/{id}:
    parameters:
      - $ref: "#/components/parameters/IssueID"
    get:
      tags:
        - Issues
      summary: Get an issue.
      responses:
        "200":
          description: Issue.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssueResponse"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    patch:
      tags:
        - Issues
      summary: Update an issue.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateIssueInput"
      responses:
        "200":
          description: Updated issue.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssueResponse"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/work-items/claim:
    post:
      tags:
        - Work Items
      summary: Claim the next pending work item.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClaimWorkItemInput"
      responses:
        "200":
          description: Claimed work item. The work item is null when no item is available.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimWorkItemResponse"
        "400":
          $ref: "#/components/responses/Error"
  /api/v1/work-items/renew-lease:
    post:
      tags:
        - Work Items
      summary: Renew a claimed work item lease.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenewWorkItemLeaseInput"
      responses:
        "200":
          description: Renewed work item lease.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RenewWorkItemLeaseResponse"
        "400":
          $ref: "#/components/responses/Error"
  /api/v1/orchestrator-events:
    post:
      tags:
        - Orchestrator Events
      summary: Receive an orchestrator run event.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunEventInput"
      responses:
        "202":
          description: Event accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptedResponse"
        "400":
          $ref: "#/components/responses/Error"
components:
  parameters:
    ProjectID:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    WorkspaceID:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    IssueID:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
  responses:
    Error:
      description: Error response.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    ApiMeta:
      type: object
      additionalProperties: true
      description: Response metadata. Currently empty, reserved for future extensions.
    ErrorInfo:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: Stable error code using the <controller>.<action>.<error_type> format.
          example: projects.get.not_found
        message:
          type: string
          example: project not found
    ErrorResponse:
      type: object
      required:
        - error
        - meta
      properties:
        error:
          $ref: "#/components/schemas/ErrorInfo"
        meta:
          $ref: "#/components/schemas/ApiMeta"
    HealthData:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          example: ok
    HealthResponse:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          $ref: "#/components/schemas/HealthData"
        meta:
          $ref: "#/components/schemas/ApiMeta"
    AcceptedData:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          example: accepted
    AcceptedResponse:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          $ref: "#/components/schemas/AcceptedData"
        meta:
          $ref: "#/components/schemas/ApiMeta"
    IssueStatus:
      type: string
      enum:
        - backlog
        - ready
        - in_progress
        - review
        - done
        - blocked
        - failed
    Priority:
      type: string
      enum:
        - low
        - normal
        - high
        - urgent
    WorkItemStatus:
      type: string
      enum:
        - pending
        - claimed
        - done
        - failed
    RunStatus:
      type: string
      enum:
        - queued
        - starting
        - running
        - waiting_for_input
        - succeeded
        - failed
        - cancelled
    WorkspaceStatus:
      type: string
      enum:
        - active
        - inactive
        - archived
    Project:
      type: object
      required:
        - id
        - key
        - name
        - description
        - createdAt
        - updatedAt
      properties:
        id:
          type: integer
          format: int64
        key:
          type: string
        name:
          type: string
        description:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreateProjectInput:
      type: object
      required:
        - key
        - name
      properties:
        key:
          type: string
        name:
          type: string
        description:
          type: string
          default: ""
    UpdateProjectInput:
      type: object
      properties:
        key:
          type: string
        name:
          type: string
        description:
          type: string
    Workspace:
      type: object
      required:
        - id
        - projectId
        - name
        - path
        - status
        - createdAt
        - updatedAt
      properties:
        id:
          type: integer
          format: int64
        projectId:
          type: integer
          format: int64
        name:
          type: string
        path:
          type: string
        status:
          $ref: "#/components/schemas/WorkspaceStatus"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreateWorkspaceInput:
      type: object
      required:
        - projectId
        - name
        - path
      properties:
        projectId:
          type: integer
          format: int64
          minimum: 1
        name:
          type: string
        path:
          type: string
        status:
          $ref: "#/components/schemas/WorkspaceStatus"
    UpdateWorkspaceInput:
      type: object
      properties:
        projectId:
          type: integer
          format: int64
          minimum: 1
        name:
          type: string
        path:
          type: string
        status:
          $ref: "#/components/schemas/WorkspaceStatus"
    Issue:
      type: object
      required:
        - id
        - title
        - description
        - status
        - priority
        - assignee
        - createdAt
        - updatedAt
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        description:
          type: string
        status:
          $ref: "#/components/schemas/IssueStatus"
        priority:
          $ref: "#/components/schemas/Priority"
        assignee:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreateIssueInput:
      type: object
      required:
        - title
      properties:
        title:
          type: string
        description:
          type: string
          default: ""
        status:
          $ref: "#/components/schemas/IssueStatus"
        priority:
          $ref: "#/components/schemas/Priority"
        assignee:
          type: string
          default: ""
    UpdateIssueInput:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        status:
          $ref: "#/components/schemas/IssueStatus"
        priority:
          $ref: "#/components/schemas/Priority"
        assignee:
          type: string
    WorkItem:
      type: object
      required:
        - id
        - issueId
        - status
        - claimedBy
        - claimToken
        - attempt
        - createdAt
        - updatedAt
        - issue
      properties:
        id:
          type: integer
          format: int64
        issueId:
          type: integer
          format: int64
        status:
          $ref: "#/components/schemas/WorkItemStatus"
        claimedBy:
          type: string
        claimToken:
          type: string
        leaseUntil:
          type: string
          format: date-time
        attempt:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        issue:
          $ref: "#/components/schemas/Issue"
    ClaimWorkItemInput:
      type: object
      required:
        - orchestratorId
        - leaseSeconds
      properties:
        orchestratorId:
          type: string
        leaseSeconds:
          type: integer
          minimum: 1
    ClaimWorkItemOutput:
      type: object
      required:
        - workItem
      properties:
        workItem:
          oneOf:
            - $ref: "#/components/schemas/WorkItem"
            - type: "null"
    RenewWorkItemLeaseInput:
      type: object
      required:
        - workItemId
        - claimToken
        - orchestratorId
        - leaseSeconds
      properties:
        workItemId:
          type: integer
          format: int64
        claimToken:
          type: string
        orchestratorId:
          type: string
        leaseSeconds:
          type: integer
          minimum: 1
    RenewWorkItemLeaseOutput:
      type: object
      required:
        - workItem
      properties:
        workItem:
          $ref: "#/components/schemas/WorkItem"
    RunEventInput:
      type: object
      required:
        - eventId
        - workItemId
        - issueId
        - runId
        - claimToken
        - status
        - workspace
        - attempt
        - error
        - occurredAt
        - orchestratorId
      properties:
        eventId:
          type: string
        workItemId:
          type: integer
          format: int64
        issueId:
          type: integer
          format: int64
        runId:
          type: string
        claimToken:
          type: string
        status:
          $ref: "#/components/schemas/RunStatus"
        workspace:
          type: string
        attempt:
          type: integer
        error:
          type: string
        occurredAt:
          type: string
          format: date-time
        orchestratorId:
          type: string
    RunSnapshot:
      type: object
      required:
        - issueId
        - workItemId
        - runId
        - status
        - workspace
        - attempt
        - error
        - orchestratorId
        - updatedAt
      properties:
        issueId:
          type: integer
          format: int64
        workItemId:
          type: integer
          format: int64
        runId:
          type: string
        status:
          $ref: "#/components/schemas/RunStatus"
        workspace:
          type: string
        attempt:
          type: integer
        error:
          type: string
        orchestratorId:
          type: string
        updatedAt:
          type: string
          format: date-time
    IssueSummary:
      allOf:
        - $ref: "#/components/schemas/Issue"
        - type: object
          properties:
            run:
              $ref: "#/components/schemas/RunSnapshot"
    Column:
      type: object
      required:
        - status
        - title
        - issues
      properties:
        status:
          $ref: "#/components/schemas/IssueStatus"
        title:
          type: string
        issues:
          type: array
          items:
            $ref: "#/components/schemas/IssueSummary"
    Summary:
      type: object
      required:
        - columns
        - runs
        - generatedAt
      properties:
        columns:
          type: array
          items:
            $ref: "#/components/schemas/Column"
        runs:
          type: array
          items:
            $ref: "#/components/schemas/RunSnapshot"
        generatedAt:
          type: string
          format: date-time
    SummaryResponse:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          $ref: "#/components/schemas/Summary"
        meta:
          $ref: "#/components/schemas/ApiMeta"
    ProjectResponse:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          $ref: "#/components/schemas/Project"
        meta:
          $ref: "#/components/schemas/ApiMeta"
    ProjectListResponse:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Project"
        meta:
          $ref: "#/components/schemas/ApiMeta"
    WorkspaceResponse:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          $ref: "#/components/schemas/Workspace"
        meta:
          $ref: "#/components/schemas/ApiMeta"
    WorkspaceListResponse:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Workspace"
        meta:
          $ref: "#/components/schemas/ApiMeta"
    IssueResponse:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          $ref: "#/components/schemas/Issue"
        meta:
          $ref: "#/components/schemas/ApiMeta"
    IssueListResponse:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Issue"
        meta:
          $ref: "#/components/schemas/ApiMeta"
    ClaimWorkItemResponse:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          $ref: "#/components/schemas/ClaimWorkItemOutput"
        meta:
          $ref: "#/components/schemas/ApiMeta"
    RenewWorkItemLeaseResponse:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          $ref: "#/components/schemas/RenewWorkItemLeaseOutput"
        meta:
          $ref: "#/components/schemas/ApiMeta"
