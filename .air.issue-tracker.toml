root = "."
tmp_dir = ".tmp/air-issue-tracker"

[build]
cmd = "mkdir -p .tmp/air-issue-tracker && rm -f .tmp/air-issue-tracker/issue-tracker && go build -o .tmp/air-issue-tracker/issue-tracker ./cmd/issue-tracker"
bin = "./.tmp/air-issue-tracker/issue-tracker"
full_bin = "./.tmp/air-issue-tracker/issue-tracker -addr :8080"
include_dir = ["cmd", "db", "internal"]
include_ext = ["go", "mod", "sql", "sum"]
exclude_dir = [".git", ".tasq", ".tmp", ".worktrees", "web"]
exclude_regex = ["_test\\.go"]
delay = 1000
stop_on_error = true
send_interrupt = true
kill_delay = 500

[log]
time = true

[misc]
clean_on_exit = true
