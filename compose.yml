services:
  dev:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    working_dir: /workspace
    command:
      - sh
      - -c
      - |
        mkdir -p /home/codex/.codex /home/codex/.cache/go-build /go/pkg/mod /workspace/web/node_modules
        chown -R codex:codex /home/codex/.codex /home/codex/.cache /go/pkg/mod /workspace/web/node_modules
        sleep infinity
    stdin_open: true
    tty: true
    environment:
      TQ_HOME: /workspace/.tasq
      CODEX_HOME: /home/codex/.codex
    ports:
      - "127.0.0.1:${ISSUE_TRACKER_PORT:-}:8080"
      - "127.0.0.1:${ORCHESTRATOR_PORT:-}:8081"
      - "127.0.0.1:${WEB_PORT:-}:3000"
    volumes:
      - .:/workspace
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/home/codex/.cache/go-build
      - web-node-modules:/workspace/web/node_modules
      - codex-home:/home/codex/.codex

  openapi:
    image: swaggerapi/swagger-ui:v5.18.2
    environment:
      URLS: '[{"url":"/openapi/issue-tracker.yml","name":"Issue Tracker"},{"url":"/openapi/orchestrator.yml","name":"Orchestrator"}]'
      URLS_PRIMARY_NAME: Issue Tracker
    ports:
      - "127.0.0.1:${OPENAPI_PORT:-}:8080"
    volumes:
      - ./docs/openapi:/usr/share/nginx/html/openapi:ro
    restart: unless-stopped

volumes:
  go-mod-cache:
  go-build-cache:
  web-node-modules:
  codex-home:
