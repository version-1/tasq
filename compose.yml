services:
  issue-tracker:
    image: golang:1.22-bookworm
    working_dir: /workspace
    command: >
      sh -c "mkdir -p /workspace/.data &&
      go mod download &&
      go run ./cmd/issue-tracker -addr :8080 -db /workspace/.data/tasq-issues.sqlite"
    ports:
      - "127.0.0.1:${ISSUE_TRACKER_PORT:-}:8080"
    volumes:
      - .:/workspace
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    restart: unless-stopped

  orchestrator:
    image: golang:1.22-bookworm
    working_dir: /workspace
    command: >
      sh -c "mkdir -p /workspace/.data &&
      go mod download &&
      go run ./cmd/orchestrator
      -db /workspace/.data/tasq-orchestrator.sqlite
      -issue-tracker http://issue-tracker:8080"
    depends_on:
      - issue-tracker
    volumes:
      - .:/workspace
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    restart: unless-stopped

  openapi:
    image: swaggerapi/swagger-ui:v5.18.2
    environment:
      SWAGGER_JSON: /openapi/issue-tracker.yml
    ports:
      - "127.0.0.1:${OPENAPI_PORT:-}:8080"
    volumes:
      - ./docs/openapi:/openapi:ro
    restart: unless-stopped

  web:
    image: node:22-bookworm
    working_dir: /workspace/web
    stdin_open: true
    tty: true
    command: >
      sh -c "npm install &&
      npm run dev -- --hostname 0.0.0.0 --port 3000"
    environment:
      NEXT_PUBLIC_ISSUE_TRACKER_URL: ${NEXT_PUBLIC_ISSUE_TRACKER_URL:-}
    ports:
      - "127.0.0.1:${WEB_PORT:-}:3000"
    depends_on:
      - issue-tracker
    volumes:
      - .:/workspace
      - web-node-modules:/workspace/web/node_modules
    restart: unless-stopped

  go-tools:
    image: golang:1.22-bookworm
    working_dir: /workspace
    profiles:
      - tools
    volumes:
      - .:/workspace
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build

volumes:
  go-mod-cache:
  go-build-cache:
  web-node-modules:
