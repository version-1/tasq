openapi: 3.1.0
info:
  title: Tasq Issue Tracker API
  version: 0.1.0
  description: |
    Local issue tracking API used by the web UI, TUI, and orchestrator.

    JSON success responses use `{ "data": ..., "meta": {} }`.
    JSON error responses use `{ "error": { "code": "...", "message": "..." }, "meta": {} }`.
    `204 No Content` and CORS `OPTIONS` responses do not include a JSON body.
servers:
  - url: http://localhost:37651
    description: Local issue-tracker API
tags:
  - name: Health
  - name: Projects
  - name: Workspaces
  - name: Issues
  - name: Comments
  - name: Attachments
  - name: Summary
paths:
  /api/v1/health:
    get:
      tags:
        - Health
      summary: Check API health.
      responses:
        "200":
          description: The API is healthy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /api/v1/summary:
    get:
      tags:
        - Summary
      summary: Get the issue board summary.
      responses:
        "200":
          description: Issue board summary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SummaryResponse"
        "500":
          $ref: "#/components/responses/Error"
  /api/v1/projects:
    get:
      tags:
        - Projects
      summary: List projects.
      responses:
        "200":
          description: Project list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectListResponse"
        "500":
          $ref: "#/components/responses/Error"
    post:
      tags:
        - Projects
      summary: Create a project.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectInput"
      responses:
        "201":
          description: Created project.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectResponse"
        "400":
          $ref: "#/components/responses/Error"
  /api/v1/projects/{id}:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
    get:
      tags:
        - Projects
      summary: Get a project.
      responses:
        "200":
          description: Project.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectResponse"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    patch:
      tags:
        - Projects
      summary: Update a project.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProjectInput"
      responses:
        "200":
          description: Updated project.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectResponse"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      tags:
        - Projects
      summary: Delete a project and its workspaces.
      responses:
        "204":
          description: Project deleted.
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/projects/{id}/check:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
    post:
      tags:
        - Projects
      summary: Check whether a project workflow documents tq command usage.
      requestBody:
        required: true
        content:
          text/plain:
            schema:
              type: string
              description: Raw WORKFLOW.md content.
      responses:
        "200":
          description: Workflow check result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectCheckResponse"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/workspaces:
    get:
      tags:
        - Workspaces
      summary: List workspaces.
      responses:
        "200":
          description: Workspace list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceListResponse"
        "500":
          $ref: "#/components/responses/Error"
    post:
      tags:
        - Workspaces
      summary: Create a workspace.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWorkspaceInput"
      responses:
        "201":
          description: Created workspace.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceResponse"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/workspaces/{id}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceID"
    get:
      tags:
        - Workspaces
      summary: Get a workspace.
      responses:
        "200":
          description: Workspace.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceResponse"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    patch:
      tags:
        - Workspaces
      summary: Update a workspace.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateWorkspaceInput"
      responses:
        "200":
          description: Updated workspace.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceResponse"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      tags:
        - Workspaces
      summary: Delete a workspace.
      responses:
        "204":
          description: Workspace deleted.
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/issues:
    get:
      tags:
        - Issues
      summary: List issues.
      parameters:
        - name: states
          in: query
          required: false
          description: Comma-separated issue statuses. Omit this parameter or pass an empty value to list all issues.
          schema:
            type: string
            example: ready,in_progress
        - name: project_id
          in: query
          required: false
          description: Project ID used to limit issues to a single project. Omit this parameter to list issues from all projects.
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Issue list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssueListResponse"
        "400":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
    post:
      tags:
        - Issues
      summary: Create an issue.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateIssueInput"
      responses:
        "201":
          description: Created issue.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssueResponse"
        "400":
          $ref: "#/components/responses/Error"
  /api/v1/issues/states:
    post:
      tags:
        - Issues
      summary: Get issue states by issue IDs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IssueStatesInput"
      responses:
        "200":
          description: Issue states. Missing issue IDs are omitted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssueStateListResponse"
        "400":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
  /api/v1/issues/{id}:
    parameters:
      - $ref: "#/components/parameters/IssueID"
    get:
      tags:
        - Issues
      summary: Get an issue.
      responses:
        "200":
          description: Issue.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssueResponse"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    patch:
      tags:
        - Issues
      summary: Update an issue.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateIssueInput"
      responses:
        "200":
          description: Updated issue.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssueResponse"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/issues/{issueId}/comments:
    parameters:
      - $ref: "#/components/parameters/IssueIDPath"
    get:
      tags:
        - Comments
      summary: List issue comments.
      parameters:
        - name: cursor
          in: query
          required: false
          description: Comment ID cursor. Results start after this ID.
          schema:
            type: integer
            format: int64
            minimum: 0
            default: 0
        - name: limit
          in: query
          required: false
          description: Maximum number of comments to return.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: Comment list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommentListResponse"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    post:
      tags:
        - Comments
      summary: Create an issue comment.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCommentInput"
      responses:
        "201":
          description: Created comment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommentResponse"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/comments/{id}:
    parameters:
      - $ref: "#/components/parameters/CommentID"
    patch:
      tags:
        - Comments
      summary: Update a comment body.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCommentInput"
      responses:
        "200":
          description: Updated comment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommentResponse"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/attachments:
    get:
      tags:
        - Attachments
      summary: List attachments for an issue or comment.
      parameters:
        - name: entity_type
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/AttachmentEntityType"
        - name: entity_id
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Attachment list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttachmentListResponse"
        "400":
          $ref: "#/components/responses/Error"
    post:
      tags:
        - Attachments
      summary: Upload an image attachment.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - entity_type
                - entity_id
                - file
              properties:
                entity_type:
                  $ref: "#/components/schemas/AttachmentEntityType"
                entity_id:
                  type: string
                file:
                  type: string
                  format: binary
                  description: PNG, JPEG, GIF, or WebP image up to 5 MiB.
      responses:
        "201":
          description: Created attachment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttachmentResponse"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/attachments/{id}/content:
    parameters:
      - $ref: "#/components/parameters/AttachmentID"
    get:
      tags:
        - Attachments
      summary: Download attachment content.
      responses:
        "200":
          description: Attachment bytes.
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/gif:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/attachments/{id}:
    parameters:
      - $ref: "#/components/parameters/AttachmentID"
    delete:
      tags:
        - Attachments
      summary: Delete attachment metadata and bytes.
      responses:
        "204":
          description: Attachment deleted.
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
components:
  parameters:
    ProjectID:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    WorkspaceID:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    IssueID:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    IssueIDPath:
      name: issueId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    CommentID:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    AttachmentID:
      name: id
      in: path
      required: true
      schema:
        type: string
  responses:
    Error:
      description: Error response.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    ApiMeta:
      type: object
      additionalProperties: true
      description: Response metadata. Currently empty, reserved for future extensions.
    ErrorInfo:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: Stable error code using the <controller>.<action>.<error_type> format.
          example: projects.get.not_found
        message:
          type: string
          example: project not found
    ErrorResponse:
      type: object
      required:
        - error
        - meta
      properties:
        error:
          $ref: "#/components/schemas/ErrorInfo"
        meta:
          $ref: "#/components/schemas/ApiMeta"
    HealthData:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          example: ok
    HealthResponse:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          $ref: "#/components/schemas/HealthData"
        meta:
          $ref: "#/components/schemas/ApiMeta"
    IssueStatus:
      type: string
      enum:
        - backlog
        - ready
        - in_progress
        - review
        - done
        - blocked
        - failed
    Priority:
      type: string
      enum:
        - low
        - normal
        - high
        - urgent
    CommentType:
      type: string
      enum:
        - progress
        - blocker
        - handoff
        - general
    AttachmentEntityType:
      type: string
      enum:
        - issue
        - comment
    WorkspaceStatus:
      type: string
      enum:
        - active
        - inactive
        - archived
    Project:
      type: object
      required:
        - id
        - key
        - name
        - description
        - location
        - createdAt
        - updatedAt
      properties:
        id:
          type: integer
          format: int64
        key:
          type: string
          pattern: "^([A-Z][A-Z0-9_]{0,19}|[a-z][a-z0-9-]{0,63})$"
        name:
          type: string
        description:
          type: string
        location:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreateProjectInput:
      type: object
      required:
        - key
        - name
        - location
      properties:
        key:
          type: string
          pattern: "^([A-Z][A-Z0-9_]{0,19}|[a-z][a-z0-9-]{0,63})$"
        name:
          type: string
        description:
          type: string
          default: ""
        location:
          type: string
    UpdateProjectInput:
      type: object
      properties:
        key:
          type: string
          pattern: "^([A-Z][A-Z0-9_]{0,19}|[a-z][a-z0-9-]{0,63})$"
        name:
          type: string
        description:
          type: string
        location:
          type: string
    ProjectCheckResult:
      type: object
      required:
        - passed
        - reason
      properties:
        passed:
          type: boolean
        reason:
          type: string
    Workspace:
      type: object
      required:
        - id
        - projectId
        - name
        - path
        - status
        - createdAt
        - updatedAt
      properties:
        id:
          type: integer
          format: int64
        projectId:
          type: integer
          format: int64
        name:
          type: string
        path:
          type: string
        status:
          $ref: "#/components/schemas/WorkspaceStatus"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreateWorkspaceInput:
      type: object
      required:
        - projectId
        - name
        - path
      properties:
        projectId:
          type: integer
          format: int64
          minimum: 1
        name:
          type: string
        path:
          type: string
        status:
          $ref: "#/components/schemas/WorkspaceStatus"
    UpdateWorkspaceInput:
      type: object
      properties:
        projectId:
          type: integer
          format: int64
          minimum: 1
        name:
          type: string
        path:
          type: string
        status:
          $ref: "#/components/schemas/WorkspaceStatus"
    Issue:
      type: object
      required:
        - id
        - projectId
        - projectKey
        - title
        - description
        - status
        - priority
        - assignee
        - createdAt
        - updatedAt
      properties:
        id:
          type: integer
          format: int64
        projectId:
          type: integer
          format: int64
        projectKey:
          type: string
        title:
          type: string
        description:
          type: string
        status:
          $ref: "#/components/schemas/IssueStatus"
        priority:
          $ref: "#/components/schemas/Priority"
        assignee:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    IssueState:
      type: object
      required:
        - id
        - status
      properties:
        id:
          type: integer
          format: int64
        status:
          $ref: "#/components/schemas/IssueStatus"
    Comment:
      type: object
      required:
        - id
        - issueId
        - author
        - type
        - body
        - createdAt
      properties:
        id:
          type: integer
          format: int64
        issueId:
          type: integer
          format: int64
        author:
          type: string
        type:
          $ref: "#/components/schemas/CommentType"
        body:
          type: string
        createdAt:
          type: string
          format: date-time
    Attachment:
      type: object
      required:
        - id
        - entityType
        - entityId
        - filename
        - contentType
        - size
        - createdAt
      properties:
        id:
          type: string
        entityType:
          $ref: "#/components/schemas/AttachmentEntityType"
        entityId:
          type: string
        filename:
          type: string
        contentType:
          type: string
          enum:
            - image/png
            - image/jpeg
            - image/gif
            - image/webp
        size:
          type: integer
          format: int64
          maximum: 5242880
        createdAt:
          type: string
          format: date-time
    CreateCommentInput:
      type: object
      required:
        - author
        - body
      properties:
        author:
          type: string
          minLength: 1
        type:
          $ref: "#/components/schemas/CommentType"
          default: general
        body:
          type: string
          minLength: 1
          maxLength: 10000
    UpdateCommentInput:
      type: object
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 10000
    CreateIssueInput:
      type: object
      required:
        - projectId
        - title
      properties:
        projectId:
          type: integer
          format: int64
        title:
          type: string
        description:
          type: string
          default: ""
        status:
          $ref: "#/components/schemas/IssueStatus"
        priority:
          $ref: "#/components/schemas/Priority"
        assignee:
          type: string
          default: ""
    UpdateIssueInput:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        status:
          $ref: "#/components/schemas/IssueStatus"
        priority:
          $ref: "#/components/schemas/Priority"
        assignee:
          type: string
    IssueStatesInput:
      type: object
      required:
        - ids
      properties:
        ids:
          type: array
          items:
            type: integer
            format: int64
    IssueSummary:
      $ref: "#/components/schemas/Issue"
    Column:
      type: object
      required:
        - status
        - title
        - issues
      properties:
        status:
          $ref: "#/components/schemas/IssueStatus"
        title:
          type: string
        issues:
          type: array
          items:
            $ref: "#/components/schemas/IssueSummary"
    Summary:
      type: object
      required:
        - columns
        - generatedAt
      properties:
        columns:
          type: array
          items:
            $ref: "#/components/schemas/Column"
        generatedAt:
          type: string
          format: date-time
    SummaryResponse:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          $ref: "#/components/schemas/Summary"
        meta:
          $ref: "#/components/schemas/ApiMeta"
    ProjectResponse:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          $ref: "#/components/schemas/Project"
        meta:
          $ref: "#/components/schemas/ApiMeta"
    ProjectListResponse:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Project"
        meta:
          $ref: "#/components/schemas/ApiMeta"
    ProjectCheckResponse:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          $ref: "#/components/schemas/ProjectCheckResult"
        meta:
          $ref: "#/components/schemas/ApiMeta"
    WorkspaceResponse:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          $ref: "#/components/schemas/Workspace"
        meta:
          $ref: "#/components/schemas/ApiMeta"
    WorkspaceListResponse:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Workspace"
        meta:
          $ref: "#/components/schemas/ApiMeta"
    IssueResponse:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          $ref: "#/components/schemas/Issue"
        meta:
          $ref: "#/components/schemas/ApiMeta"
    IssueListResponse:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Issue"
        meta:
          $ref: "#/components/schemas/ApiMeta"
    IssueStateListResponse:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/IssueState"
        meta:
          $ref: "#/components/schemas/ApiMeta"
    CommentListMeta:
      type: object
      required:
        - cursor
        - limit
        - nextCursor
      properties:
        cursor:
          type: integer
          format: int64
        limit:
          type: integer
        nextCursor:
          oneOf:
            - type: integer
              format: int64
            - type: "null"
    CommentResponse:
      type: object
      required:
        - data
        - meta
      properties:
