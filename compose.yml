services:
  issue-tracker:
    image: golang:1.22-bookworm
    working_dir: /workspace
    command: >
      sh -c "mkdir -p /workspace/.tmp &&
      go mod download &&
      go run github.com/air-verse/air@${AIR_VERSION:-v1.52.3} -c .air.issue-tracker.toml"
    environment:
      TQ_HOME: /workspace/.tasq
    ports:
      - "127.0.0.1:${ISSUE_TRACKER_PORT:-}:8080"
    volumes:
      - .:/workspace
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    restart: unless-stopped

  orchestrator:
    image: golang:1.22-bookworm
    working_dir: /workspace
    command: >
      sh -c "mkdir -p /workspace/.tmp &&
      go mod download &&
      go run github.com/air-verse/air@${AIR_VERSION:-v1.52.3} -c .air.orchestrator.toml"
    environment:
      TQ_HOME: /workspace/.tasq
    depends_on:
      - issue-tracker
    volumes:
      - .:/workspace
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    restart: unless-stopped

  openapi:
    image: swaggerapi/swagger-ui:v5.18.2
    environment:
      URLS: '[{"url":"/openapi/issue-tracker.yml","name":"Issue Tracker"},{"url":"/openapi/orchestrator.yml","name":"Orchestrator"}]'
      URLS_PRIMARY_NAME: Issue Tracker
    ports:
      - "127.0.0.1:${OPENAPI_PORT:-}:8080"
    volumes:
      - ./docs/openapi:/usr/share/nginx/html/openapi:ro
    restart: unless-stopped

  web:
    image: node:22-bookworm
    working_dir: /workspace/web
    stdin_open: true
    tty: true
    command: >
      sh -c "npm install &&
      npm run dev -- --hostname 0.0.0.0 --port 3000"
    environment:
      NEXT_PUBLIC_ISSUE_TRACKER_URL: ${NEXT_PUBLIC_ISSUE_TRACKER_URL:-}
    ports:
      - "127.0.0.1:${WEB_PORT:-}:3000"
    depends_on:
      - issue-tracker
    volumes:
      - .:/workspace
      - web-node-modules:/workspace/web/node_modules
    restart: unless-stopped

  go-tools:
    image: golang:1.22-bookworm
    working_dir: /workspace
    profiles:
      - tools
    volumes:
      - .:/workspace
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build

volumes:
  go-mod-cache:
  go-build-cache:
  web-node-modules:
